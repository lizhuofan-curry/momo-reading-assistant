<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="连接自己的 AI API 与墨墨 Token"><title>连接设置 · 拾词</title><link rel="stylesheet" href="/site.css"></head><body><header class="topbar"><nav class="nav"><a class="brand" href="/"><span class="brand-mark">拾</span><strong>拾词</strong></a><div class="nav-links"><a href="/guide/">使用教程</a><a href="/privacy/">隐私说明</a><a href="/help/">常见问题</a><a aria-current="page" href="/connections/">连接设置</a><a class="nav-cta" href="/">返回工作台</a></div></nav></header><main class="page"><section class="hero"><div class="eyebrow">Connections</div><h1>连接你自己的服务。</h1><p>先测试，再保存到当前标签页。密钥不会写入本站数据库，关闭标签页后需要重新连接。</p></section><div class="provider-grid"><section class="sheet"><span class="badge">AI API</span><h2>选择模型服务商</h2><div class="field"><label for="provider">服务商</label><select id="provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="qwen">阿里云百炼 Qwen</option><option value="openrouter">OpenRouter</option></select></div><div class="field"><label for="model">模型名称</label><input id="model" autocomplete="off"></div><div class="field"><label for="api-key">API Key</label><input id="api-key" type="password" autocomplete="off" placeholder="仅在当前标签页使用"></div><div class="actions"><button class="button" id="test-ai">测试 AI 连接</button><button class="button secondary" id="clear-ai">清除</button></div><p class="status" id="ai-status" aria-live="polite"></p></section><section class="sheet"><span class="badge">WORDBOOK</span><h2>连接词本同步</h2><div class="note warning">本站是非官方工具，因此不展示墨墨官方 Logo。同步时必须使用你自己的 Access Token。</div><div class="field"><label for="memo-token">墨墨 Access Token</label><input id="memo-token" type="password" autocomplete="off" placeholder="仅在当前标签页使用"></div><div class="actions"><button class="button" id="test-memo">测试 Token</button><button class="button secondary" id="clear-memo">清除</button></div><p class="status" id="memo-status" aria-live="polite"></p><p><a href="https://www.maimemo.com/pages/openapi/introduction?open_by=share" rel="noreferrer">前往墨墨开放平台获取 Token</a></p></section></div><div class="actions"><a class="button" href="/">完成，返回工作台</a></div></main><footer class="footer"><span>连接信息只保留在当前标签页</span><span><a href="/privacy/">查看完整隐私说明</a></span></footer><script type="module" src="/connections.js"></script></body></html>
